name: Beta 5 final Linux distributable acceptance

# Distribution operations only: this adds operational provenance, not product
# source provenance. The immutable source is 44bfe6f14d571a10a91075c54d16258055f94b06
# (v0.1.0-beta.5). Already-created candidates must never be rebuilt here.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Linux distributable to accept
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-arm64

# Draft listings require push access, even though the REST operations are GETs.
# No other repository permissions are granted; no checkout is needed.
permissions:
  contents: write

jobs:
  acceptance:
    if: github.repository == 'KoriM14/releasescout-beta'
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm"}')[inputs.architecture] }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ARCHITECTURE: ${{ inputs.architecture }}
      SOURCE_SHA: 44bfe6f14d571a10a91075c54d16258055f94b06
      TOOLS_SHA: 09503fde33609b92b81a36f649c69a07609962c4905e8c611516b5c474f0b4f5

    steps:
      - name: Create private workspace and select fixed inputs
        id: workspace
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = KoriM14/releasescout-beta
          case "$ARCHITECTURE" in
            linux-x86_64)
              archive=releasescout-0.1.0-linux-x86_64.tar.gz
              archive_sha=41b9729dd30d9e5cc3f66a3e719f5813656a84721d9fb35a7e24f769463e7103
              identity=df2ea08ffdf1071ffefffc7a9a7f38e6a25b06107d9f26a645aca1b80af00784
              finalization_sha=a41bb16914fc3b9f305b37f4364a4244f9eb8ab89b70e9ee8dfa7f51e35c33b4
              ;;
            linux-arm64)
              archive=releasescout-0.1.0-linux-arm64.tar.gz
              archive_sha=7dfd2c27a77551c8ebe22d52f8c9d0f8a2f8b1e9bb55f40159d0d297feccdcfa
              identity=c25f691dca479edf855e3de99e9aa503000c7aa04b311c2eda03e019eefdeac0
              finalization_sha=acf61cde56df9180a5c62e97402ce3c26849b7a3cbf0c6e5cca3eda2fcec9e12
              ;;
            *) echo 'Unsupported architecture' >&2; exit 1 ;;
          esac
          root=$(mktemp -d "$RUNNER_TEMP/beta5-final-acceptance.XXXXXXXXXX")
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo "ACCEPTANCE_ROOT=$root"
            echo "ARCHIVE=$archive"
            echo "ARCHIVE_SHA=$archive_sha"
            echo "EXPECTED_IDENTITY=$identity"
            echo "FINALIZATION_SHA=$finalization_sha"
          } >> "$GITHUB_ENV"
          mkdir "$root/inputs" "$root/tools" "$root/extracted" "$root/home" "$root/runtime"
          mkdir "$root/home/state" "$root/home/config" "$root/home/cache" "$root/runtime/xdg"

      - name: Set up native Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          # Override the action's default token; no package cache is enabled.
          token: ''

      - name: Install external smoke runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bash git python3 python3-venv tar ruby ruby-minitest libstdc++6 libatomic1

      - name: Record and require native Ubuntu 24.04 environment
        run: |
          set -euo pipefail
          printf 'runner_name=%s runner_environment=%s runner_os=%s runner_arch=%s\n' \
            "${RUNNER_NAME:-unknown}" "${RUNNER_ENVIRONMENT:-unknown}" \
            "${RUNNER_OS:-unknown}" "${RUNNER_ARCH:-unknown}"
          uname -a
          uname -m
          cat /etc/os-release
          dpkg --print-architecture
          getconf GNU_LIBC_VERSION
          python3 --version
          python3 -c 'import platform; print("python_machine=" + platform.machine())'
          git --version
          node --version
          node -p '"node_arch=" + process.arch'
          ruby --version
          ruby -rminitest -e 'puts "minitest_version=#{Minitest::VERSION}"'
          bash --version
          tar --version
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          # All independent architecture observations must agree: no emulation.
          case "$ARCHITECTURE" in
            linux-x86_64) machine=x86_64; deb=amd64; node_arch=x64; runner_arch=X64 ;;
            linux-arm64) machine=aarch64; deb=arm64; node_arch=arm64; runner_arch=ARM64 ;;
            *) exit 1 ;;
          esac
          test "$(uname -m)" = "$machine"
          test "$(dpkg --print-architecture)" = "$deb"
          test "$(python3 -c 'import platform; print(platform.machine())')" = "$machine"
          test "$(node -p 'process.arch')" = "$node_arch"
          test "$RUNNER_ARCH" = "$runner_arch"
          test "$(node -p 'process.versions.node.split(".")[0]')" = 20
          python3 -m venv "$ACCEPTANCE_ROOT/runtime/venv-check"
          "$ACCEPTANCE_ROOT/runtime/venv-check/bin/python" -c 'import sys; assert sys.prefix != sys.base_prefix'

      - name: Discover draft assets, download exact inputs, and verify pinned hashes
        env:
          # This is the only step that receives repository authentication.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = 'https://api.github.com/repos/KoriM14/releasescout-beta'
          tag = 'beta5-final-acceptance-inputs'
          token = os.environ.pop('GITHUB_TOKEN')
          root = Path(os.environ['ACCEPTANCE_ROOT']) / 'inputs'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def request(path, binary=False):
              # Construct only this repository's API paths, never asset-supplied URLs.
              req = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/octet-stream' if binary else 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              return opener.open(req, timeout=120)

          def listing(path):
              result = []
              page = 1
              while True:
                  with request(f'{path}?per_page=100&page={page}') as response:
                      batch = json.load(response)
                  if not isinstance(batch, list):
                      raise SystemExit('Invalid GitHub list response')
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
                  page += 1

          def require_draft(release):
              if release.get('tag_name') != tag or release.get('draft') is not True:
                  raise SystemExit('Input release must retain the fixed tag and draft: true')

          def numeric_id(value):
              if type(value) is not int or value <= 0:
                  raise SystemExit('Invalid GitHub object ID')
              return value

          matches = [r for r in listing('/releases') if r.get('tag_name') == tag]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one temporary input release; found {len(matches)}')
          require_draft(matches[0])
          release_id = numeric_id(matches[0]['id'])
          assets = listing(f'/releases/{release_id}/assets')
          names = [a['name'] for a in assets]
          if len(names) != len(set(names)):
              raise SystemExit('Duplicate asset names in input release')
          arch = os.environ['ARCHITECTURE']
          expected = {
              'beta5-acceptance-tools.tar': os.environ['TOOLS_SHA'],
              os.environ['ARCHIVE']: os.environ['ARCHIVE_SHA'],
              f'{arch}-distribution-identity.json': os.environ['EXPECTED_IDENTITY'],
              f'{arch}-finalization.json': os.environ['FINALIZATION_SHA'],
          }
          for name, digest in expected.items():
              selected = [a for a in assets if a['name'] == name]
              if len(selected) != 1 or selected[0].get('state') != 'uploaded':
                  raise SystemExit(f'Missing or incomplete required asset: {name}')
              asset_id = numeric_id(selected[0]['id'])
              try:
                  response = request(f'/releases/assets/{asset_id}', binary=True)
              except urllib.error.HTTPError as error:
                  if error.code != 302:
                      raise SystemExit(f'Authenticated asset download failed: {name} ({error.code})') from None
                  # GitHub issues a temporary signed asset URL. Never forward the
                  # repository token to storage, or follow arbitrary redirects.
                  location = error.headers.get('Location', '')
                  url = urllib.parse.urlsplit(location)
                  if (url.scheme != 'https' or url.hostname != 'release-assets.githubusercontent.com'
                          or url.port not in (None, 443) or url.username or url.password
                          or not url.query or url.fragment):
                      raise SystemExit('Unexpected GitHub asset redirect')
                  response = opener.open(urllib.request.Request(location), timeout=120)
              with response, (root / name).open('xb') as output:
                  shutil.copyfileobj(response, output)
              # Draft assets are mutable; only these pinned hashes establish integrity.
              with (root / name).open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              if actual != digest:
                  raise SystemExit(f'SHA-256 mismatch: {name}')
              print(f'Pinned SHA-256 verified: {name} {actual}')
          with request(f'/releases/{release_id}') as response:
              require_draft(json.load(response))
          PY

      - name: Validate finalization record and safely extract pinned inputs
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['ACCEPTANCE_ROOT'])
          inputs = root / 'inputs'
          arch = os.environ['ARCHITECTURE']
          archive = os.environ['ARCHIVE']
          identity = os.environ['EXPECTED_IDENTITY']
          expected = {
              'schema': 'releasescout-distribution-finalization',
              'version': 1,
              'source_sha': '44bfe6f14d571a10a91075c54d16258055f94b06',
              'platform': arch,
              'archive': archive,
              'archive_sha256': os.environ['ARCHIVE_SHA'],
              'distribution_identity_sha256': identity,
              'build_identity_sha256': identity,
              'normalization': 'internal-relative-links-to-independent-files-v1',
              'qualification': 'pending-native-installer-smoke-and-pro-acceptance',
          }
          record = json.loads((inputs / f'{arch}-finalization.json').read_text())
          for key, value in expected.items():
              if type(record.get(key)) is not type(value) or record[key] != value:
                  raise SystemExit(f'Finalization discrepancy: {key}')

          def safe_members(tar, expected_names=None):
              members = tar.getmembers()
              seen = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  if (path.is_absolute() or '..' in path.parts or not path.parts
                          or member.name in seen or not (member.isfile() or member.isdir())
                          or member.mode & 0o7000):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
                  seen.add(member.name)
                  if expected_names is None and path.parts[0] != 'releasescout':
                      raise SystemExit('Unexpected final archive root')
              if expected_names is not None:
                  if seen != set(expected_names):
                      raise SystemExit('Acceptance tools member list differs from pinned contract')
                  for member in members:
                      if member.isdir() != (expected_names[member.name] == 'directory'):
                          raise SystemExit('Acceptance tools member type differs from contract')
              return members

          # This tar is the pinned five-file export from the immutable Beta 5 source.
          tool_members = {
              'packaging': 'directory',
              'scripts': 'directory',
              'packaging/install.sh': 'file',
              'packaging/frozen_smoke.py': 'file',
              'packaging/qualification_process.py': 'file',
              'scripts/qualified_bundle_handoff.py': 'file',
              'scripts/qualify_frozen_pro_path.py': 'file',
          }
          with tarfile.open(inputs / 'beta5-acceptance-tools.tar', 'r:') as tar:
              members = safe_members(tar, tool_members)
              tar.extractall(root / 'tools', members=members, filter='tar')
          # Normalized final candidates contain independent files, no links or
          # special entries. Verify again before extracting into a fresh directory.
          with (inputs / archive).open('rb') as stream:
              if hashlib.file_digest(stream, 'sha256').hexdigest() != os.environ['ARCHIVE_SHA']:
                  raise SystemExit('Final archive SHA-256 mismatch before extraction')
          with tarfile.open(inputs / archive, 'r:gz') as tar:
              members = safe_members(tar)
              # The identity includes directory modes. The tar filter preserves
              # those; safe_members already forbids every link and special file.
              tar.extractall(root / 'extracted', members=members, filter='tar')
          PY

      - name: Verify recovered distribution, install locally, and smoke installed bundle
        run: |
          set -euo pipefail
          umask 077
          # Downloaded tools and product processes receive no Actions credentials,
          # source environment, installer overrides, or network installation input.
          env -i PATH="$PATH" HOME="$ACCEPTANCE_ROOT/home" \
            XDG_STATE_HOME="$ACCEPTANCE_ROOT/home/state" \
            XDG_CONFIG_HOME="$ACCEPTANCE_ROOT/home/config" \
            XDG_CACHE_HOME="$ACCEPTANCE_ROOT/home/cache" \
            XDG_RUNTIME_DIR="$ACCEPTANCE_ROOT/runtime/xdg" \
            TMPDIR="$ACCEPTANCE_ROOT/runtime" TMP="$ACCEPTANCE_ROOT/runtime" TEMP="$ACCEPTANCE_ROOT/runtime" \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 NO_PROXY= \
            ACCEPTANCE_ROOT="$ACCEPTANCE_ROOT" ARCHITECTURE="$ARCHITECTURE" \
            ARCHIVE="$ARCHIVE" ARCHIVE_SHA="$ARCHIVE_SHA" EXPECTED_IDENTITY="$EXPECTED_IDENTITY" \
            bash --noprofile --norc -euo pipefail <<'ACCEPT'
          cd "$ACCEPTANCE_ROOT"
          identity="$ACCEPTANCE_ROOT/inputs/$ARCHITECTURE-distribution-identity.json"
          verify_bundle() {
            local result
            result=$(python3 tools/scripts/qualified_bundle_handoff.py verify-bundle \
              --bundle "$1" --identity "$identity")
            printf '%s\n' "$result"
            printf '%s\n' "$result" | python3 -c \
              'import json, os, sys; r=json.load(sys.stdin); assert r["bundle_identity_sha256"] == os.environ["EXPECTED_IDENTITY"], "Bundle identity mismatch"'
          }
          verify_bundle "$ACCEPTANCE_ROOT/extracted/releasescout"
          # The installer's cp -R needs the normal umask to retain qualified
          # modes. The enclosing workspace and isolated HOME remain mode 0700.
          (
            umask 022
            sh tools/packaging/install.sh \
              --archive "$ACCEPTANCE_ROOT/inputs/$ARCHIVE" --sha256 "$ARCHIVE_SHA" --version 0.1.0
          )
          installed="$HOME/.local/share/releasescout/versions/0.1.0/$ARCHIVE_SHA/releasescout"
          test -d "$installed"
          test ! -L "$installed"
          test -x "$installed/releasescout"
          test -x "$installed/releasescout-frozen-probe"
          verify_bundle "$installed"
          "$HOME/.local/bin/releasescout" --version
          python3 tools/packaging/frozen_smoke.py "$installed/releasescout" 2>&1 | tee smoke.log
          python3 - <<'PY'
          from pathlib import Path
          text = Path('smoke.log').read_text()
          if 'unqualified' in text.lower() or 'FROZEN SMOKE PASSED' not in text:
              raise SystemExit('Frozen smoke did not provide complete qualified coverage')
          PY
          ACCEPT

      - name: Signed-Pro acceptance through installed public launcher
        env:
          # Normal logs are public. Only this step receives the signed entitlement;
          # the signing key must never be present anywhere in this workflow.
          RELEASESCOUT_BETA_QUALIFICATION_ENTITLEMENT_B64: ${{ secrets.RELEASESCOUT_BETA_QUALIFICATION_ENTITLEMENT_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['ACCEPTANCE_ROOT'])
          encoded = os.environ.pop('RELEASESCOUT_BETA_QUALIFICATION_ENTITLEMENT_B64', '')
          if not encoded.strip():
              raise SystemExit('Missing or empty RELEASESCOUT_BETA_QUALIFICATION_ENTITLEMENT_B64 secret')
          try:
              material = base64.b64decode(''.join(encoded.split()), validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('Qualification entitlement is not valid base64') from None
          if not 0 < len(material) <= 32768:
              raise SystemExit('Qualification entitlement is empty or exceeds the bounded size')
          home = root / 'home'
          runtime = root / 'runtime'
          environment = {
              'PATH': os.environ['PATH'], 'HOME': str(home),
              'XDG_STATE_HOME': str(home / 'state'), 'XDG_CONFIG_HOME': str(home / 'config'),
              'XDG_CACHE_HOME': str(home / 'cache'), 'XDG_RUNTIME_DIR': str(runtime / 'xdg'),
              'TMPDIR': str(runtime), 'TMP': str(runtime), 'TEMP': str(runtime),
              'LANG': 'C.UTF-8', 'LC_ALL': 'C.UTF-8',
              'HTTP_PROXY': 'http://127.0.0.1:9', 'HTTPS_PROXY': 'http://127.0.0.1:9',
              'ALL_PROXY': 'http://127.0.0.1:9', 'NO_PROXY': '',
          }
          entitlement = runtime / 'qualification-entitlement.json'
          try:
              fd = os.open(entitlement, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(material)
              del encoded, material
              # Keep harness failure diagnostics private: activation output can
              # contain signed material that is not covered by base64 masking.
              with (root / 'pro-acceptance.log').open('xb') as log:
                  result = subprocess.run([
                      'python3', str(root / 'tools/scripts/qualify_frozen_pro_path.py'),
                      '--executable', str(home / '.local/bin/releasescout'),
                      '--entitlement', str(entitlement),
                  ], cwd=root, env=environment, stdout=log, stderr=subprocess.STDOUT,
                     timeout=1200, check=False)
              if result.returncode != 0:
                  raise SystemExit('Signed-Pro acceptance failed; secret-bearing diagnostics withheld')
              if 'FROZEN PRO ACCEPTANCE PASSED' not in (root / 'pro-acceptance.log').read_text():
                  raise SystemExit('Signed-Pro acceptance success marker missing')
              print('FROZEN PRO ACCEPTANCE PASSED')
          finally:
              entitlement.unlink(missing_ok=True)
          PY

      - name: Verify unchanged installed identity and original archive, then report PASS
        run: |
          set -euo pipefail
          umask 077
          installed="$ACCEPTANCE_ROOT/home/.local/share/releasescout/versions/0.1.0/$ARCHIVE_SHA/releasescout"
          result=$(env -i PATH="$PATH" HOME="$ACCEPTANCE_ROOT/home" TMPDIR="$ACCEPTANCE_ROOT/runtime" \
            python3 "$ACCEPTANCE_ROOT/tools/scripts/qualified_bundle_handoff.py" verify-bundle \
            --bundle "$installed" --identity "$ACCEPTANCE_ROOT/inputs/$ARCHITECTURE-distribution-identity.json")
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python3 -c \
            'import json, os, sys; r=json.load(sys.stdin); assert r["bundle_identity_sha256"] == os.environ["EXPECTED_IDENTITY"], "Post-Pro identity mismatch"'
          printf '%s  %s\n' "$ARCHIVE_SHA" "$ACCEPTANCE_ROOT/inputs/$ARCHIVE" | sha256sum --check --strict
          printf 'FINAL_DISTRIBUTABLE_ACCEPTANCE=PASS architecture=%s source_sha=%s\n' "$ARCHITECTURE" "$SOURCE_SHA"
          {
            echo 'Beta 5 final Linux distributable acceptance: PASS'
            echo
            echo "- Architecture: $ARCHITECTURE"
            echo "- Runner architecture: $RUNNER_ARCH ($(uname -m))"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Archive: $ARCHIVE"
            echo "- Archive SHA-256: $ARCHIVE_SHA"
            echo "- Distribution identity: $EXPECTED_IDENTITY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all private acceptance state
        if: always()
        env:
          CLEANUP_ROOT: ${{ steps.workspace.outputs.root }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          value = os.environ.get('CLEANUP_ROOT', '')
          if not value:
              raise SystemExit(0)
          root = Path(value)
          # Only the unique direct child created by mktemp may be removed.
          parent = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if (root.is_symlink() or root.parent.resolve(strict=True) != parent
                  or not re.fullmatch(r'beta5-final-acceptance\.[A-Za-z0-9]{10}', root.name)):
              raise SystemExit('Refusing cleanup outside the workflow-created workspace')
          if root.exists():
              shutil.rmtree(root)
          PY
